[package]
name = "fast_websocket_client"
version = "1.0.0"
edition = "2024"
categories = [
    "asynchronous",
    "concurrency",
    "network-programming",
    "web-programming",
    "web-programming::websocket",
]
keywords = ["async", "client", "tokio", "websocket", "wss"]
license = "Apache-2.0"
authors = ["Hyoungjun Son"]
description = "Tokio-native WebSocket client for Rust. High-throughput, low-latency, callback-driven, proxy-ready."
repository = "https://github.com/Osteoporosis/fast_websocket_client/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[example]]
name = "wss_client"
path = "examples/async_callback_client.rs"
required-features = ["callback_client"]

[[example]]
name = "builders_channels_handler_functions"
path = "examples/builders_channels_handler_functions.rs"
required-features = ["callback_client"]

[dependencies]
base64 = "0.23.1"
fastwebsockets = { version = "0.10.0", features = ["simd", "upgrade", "unstable-split"] }
http-body-util = "0.1.5"
httparse = { version = "1.10.1", optional = true }
hyper = "1.12.0"
hyper-util = "0.1.21"
rustls-pki-types = "1.16.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha1 = "0.11.0"
simdutf8 = { version = "0.1.5", features = ["aarch64_neon"] }
thiserror = { version = "2.0.21", optional = true }
tokio = { version = "1.54.1", default-features = false, features = [
    "net",
    "parking_lot",
    "rt",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "logging",
    "tls12",
] }
tokio-socks = { version = "0.5.3", optional = true }
url = "2.5.8"
webpki-roots = "1.0.12"

[features]
default = ["callback_client", "proxy", "aws_lc_rs"]
# Kept for callers that enabled the formerly optional dependency directly.
base64 = []
aws_lc_rs = ["tokio-rustls/aws_lc_rs"]
ring = ["tokio-rustls/ring"]
callback_client = ["proxy", "thiserror", "tokio/macros"]
proxy = ["httparse", "tokio-socks"]

[dev-dependencies]
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = [
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "time",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
